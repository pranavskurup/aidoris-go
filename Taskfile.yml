version: '3'

vars:
  BIN_NAME: aidoris
  OUTPUT_DIR: dist
  MAIN_PKG: ./cmd/aidoris
  WEB_DIR: web
  WEB_APP_DIR: web/apps/web

includes:
  web:
    taskfile: ./web/Taskfile.yml
    dir: ./web

tasks:
  build:web:
    desc: Build the web frontend (delegates to web/Taskfile)
    cmds:
      - task: web:web:build

  build:web:binary:prepare:
    desc: Prepare web app for Deno compile (.output) (delegates to web/Taskfile)
    run: once
    cmds:
      - task: web:web:deno:prepare

  build:web:binary:linux_x64:
    desc: Build aidoris-web binary for linux/amd64 (delegates to web/Taskfile)
    deps:
      - task: build:web:binary:prepare
    cmds:
      - task: web:web:deno:build:linux:x64

  build:web:binary:linux_arm64:
    desc: Build aidoris-web binary for linux/arm64 (delegates to web/Taskfile)
    deps:
      - task: build:web:binary:prepare
    cmds:
      - task: web:web:deno:build:linux:arm64

  build:web:binary:darwin_x64:
    desc: Build aidoris-web binary for darwin/amd64 (delegates to web/Taskfile)
    deps:
      - task: build:web:binary:prepare
    cmds:
      - task: web:web:deno:build:darwin:x64

  build:web:binary:darwin_arm64:
    desc: Build aidoris-web binary for darwin/arm64 (Apple Silicon, delegates to web/Taskfile)
    deps:
      - task: build:web:binary:prepare
    cmds:
      - task: web:web:deno:build:darwin:arm64

  build:web:binary:windows_x64:
    desc: Build aidoris-web binary for windows/amd64 (delegates to web/Taskfile)
    deps:
      - task: build:web:binary:prepare
    cmds:
      - task: web:web:deno:build:windows:x64

  build:web:binary:all:
    desc: Build aidoris-web binaries for all OS/architectures (prepare once, then all builds via pnpm; cross-platform)
    cmds:
      - cd {{.WEB_APP_DIR}} && pnpm run build:deno:all

  generate:web:dist:
    desc: Build web binaries then copy dist to embeddedadapter (cmd/generate_web_dist)
    deps:
      - task: build:web:binary:all
    cmds:
      - go run ./cmd/generate_web_dist

  build:linux_amd64:
    desc: Build linux/amd64 binary
    cmds:
      - mkdir -p {{.OUTPUT_DIR}}
      - GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o "{{.OUTPUT_DIR}}/{{.BIN_NAME}}-linux-amd64" "{{.MAIN_PKG}}"

  build:linux_arm64:
    desc: Build linux/arm64 binary
    cmds:
      - mkdir -p {{.OUTPUT_DIR}}
      - GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o "{{.OUTPUT_DIR}}/{{.BIN_NAME}}-linux-arm64" "{{.MAIN_PKG}}"

  build:windows_amd64:
    desc: Build windows/amd64 binary
    cmds:
      - mkdir -p {{.OUTPUT_DIR}}
      - GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o "{{.OUTPUT_DIR}}/{{.BIN_NAME}}-windows-amd64.exe" "{{.MAIN_PKG}}"

  build:darwin_arm64:
    desc: Build darwin/arm64 (Apple Silicon) binary
    cmds:
      - mkdir -p {{.OUTPUT_DIR}}
      - GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o "{{.OUTPUT_DIR}}/{{.BIN_NAME}}-darwin-arm64" "{{.MAIN_PKG}}"

  build:all:
    desc: Build Go binary for all supported OS/architectures
    deps:
      - task: build:linux_amd64
      - task: build:linux_arm64
      - task: build:windows_amd64
      - task: build:darwin_arm64

  build:
    desc: Build web frontend, then Go binaries for all OS/architectures
    cmds:
      - task: generate:web:dist
      - task: build:all